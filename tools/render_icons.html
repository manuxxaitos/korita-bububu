<!doctype html><meta charset=utf-8><body style="margin:0;background:#fff">
<script type=module>
// Genera favicon, ícono de iPhone y la pata 2D de respaldo (sin WebGL). Se usa con tools/render_icons.cjs.
import {Pen,drawKora,drawDrumstick} from '../kora-draw.js';
function make(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const p=new Pen(x);p.tick(0);fn(x,p,w,h);return c.toDataURL('image/png');}
await document.fonts.ready;
window.out={
 favicon:make(64,64,(x,p,w,h)=>{x.fillStyle='#f3cb4f';x.beginPath();x.arc(32,32,31,0,7);x.fill();drawKora(p,32,38,40,{body:false,happy:.4});}),
 touch:make(180,180,(x,p,w,h)=>{x.fillStyle='#f3cb4f';x.fillRect(0,0,w,h);drawKora(p,90,104,112,{body:false,happy:.6});}),
 pollo:make(600,600,(x,p)=>{drawDrumstick(p,300,300,470,-0.6);}),
};
</script>
